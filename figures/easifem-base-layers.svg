<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580"
     viewBox="0 0 960 580" role="img"
     aria-labelledby="title desc">
  <title id="title">Where easifemBase fits in EASIFEM</title>
  <desc id="desc">
    easifemClasses, the physics kernels and user applications build on
    easifemBase. easifemBase provides the data types, containers,
    geometry, interpolation, quadrature, sparse matrices and finite
    element kernels, and links to optional external packages such as
    OpenBLAS, LAPACK95, Sparsekit, SuperLU, METIS, HDF5, PLplot, ARPACK,
    FFTW, LIS and Gmsh.
  </desc>

  <defs>
