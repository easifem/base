    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32302F"/>
      <stop offset="1" stop-color="#1D2021"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#689D6A"/>
      <stop offset="0.5" stop-color="#8EC07C"/>
      <stop offset="1" stop-color="#B8BB26"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8EC07C" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8EC07C" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
